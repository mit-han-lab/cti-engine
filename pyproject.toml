[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cti"
version = "0.0.1"
description = "A lightweight single-GPU engine for inference and selected-parameter training"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "accelerate",
    "msgpack",
    "cti-kernels[cute,gdn,varlen]==0.0.1",
    "torch==2.13.0",
    "transformers==5.16.1",
    "huggingface-hub>=1.5,<2",
    "safetensors>=0.8",
    # The 0.0.9.post1 wheel predates per-tag/per-device MemPools. Keep this
    # immutable until upstream publishes an equivalent release artifact.
    "torch-memory-saver @ git+https://github.com/fzyzcjy/torch_memory_saver.git@6d5bce48c898c64497be2022fbdc08cc7ddb5637",
    "pyzmq",
    "uvicorn",
    "fastapi",
    "httpx",
    "openai",
    "jinja2",
    "pillow",
    "PyYAML>=6,<7",
]

[project.urls]
Repository = "https://github.com/mit-han-lab/cti-engine"
Issues = "https://github.com/mit-han-lab/cti-engine/issues"

[project.optional-dependencies]
modelscope = ["modelscope"]
dev = [
    "build>=1.3,<2",
    "packaging>=24",
    "peft==0.19.1",
    "pytest>=6.0",
    "pytest-cov>=6",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "pre-commit>=4.2,<5",
    "ruff>=0.15,<0.16",
    "matplotlib>=3.10.5",
    "pyarrow",
]

[dependency-groups]
cpu-ci = [
    # Transformers needs it for any device_map, and the Qwen3.5 reference helper's CPU test
    # runs accelerate's offloading (it brings psutil, which that helper reads).
    "accelerate",
    "build>=1.3,<2",
    "fastapi",
    "httpx",
    "jinja2",
    "msgpack",
    "numpy",
    "openai",
    "packaging>=24",
    "peft==0.19.1",
    "pillow",
    "pytest>=6.0",
    "pytest-cov>=6",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "PyYAML>=6,<7",
    "pyzmq",
    "safetensors>=0.8",
    "transformers==5.16.1",
    "tqdm",
    "uvicorn",
]

[tool.setuptools]
include-package-data = false
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["cti", "cti.*"]
namespaces = false

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # import sorting
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "ASYNC",  # async correctness
    "BLE001", # blind exception catches
    "G",      # logging format
    "PLW2901", # overwritten loop variables
    "PLE",    # Pylint errors
    "RET503", # inconsistent return paths
    "RUF006", # dangling asyncio tasks
    "RUF100", # unused noqa directives
    "S110",   # silently swallowed exceptions
]
ignore = [
    "E501", # line length is enforced by the formatter where it can rewrite safely
    "E731", # assigned lambdas are idiomatic for Triton launch grids and small callbacks
]

[tool.ruff.lint.isort]
known-first-party = ["cti", "ctikernels"]

[tool.ruff.format]
docstring-code-format = true

[tool.typos.default.extend-words]
# Transformers names a (temporal, height, width) patch grid "thw".
thw = "thw"
# Qwen3.5's Gated DeltaNet projects beta and alpha in "in_proj_ba".
ba = "ba"
# UE8M0: the unsigned E8M0 scale format.
ue = "ue"

[tool.pytest.ini_options]
# Not tests/hf_parity: by-hand checks on hardware beyond the GPU tiers' (its README.md).
testpaths = [
    "tests/modules",
    "tests/integration",
    "tests/benchmarks",
    "tests/quality",
    "tests/gpu",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "gpu_fast_1: a GPU test of the fast tier's first shard (tests/gpu/conftest.py)",
    "gpu_fast_2: a GPU test of the fast tier's second shard",
    "gpu_tp_1: a tensor-parallel GPU test of the first tp shard",
    "gpu_tp_2: a tensor-parallel GPU test of the second tp shard",
    "gpu_full: a GPU test of the full tier only",
    "gpu_full_1: a GPU test of the full tier's first shard",
    "gpu_full_2: a GPU test of the full tier's second shard",
    "gpu_full_tp: a tensor-parallel GPU test of the full tier's tp shard",
    "checkpoints(*pins): the pinned checkpoints a GPU test reads (tests/support/checkpoints.py)",
    "xdist_group(name): tests pytest-xdist runs on one worker under --dist loadgroup",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=cti",
    "--cov-branch",
    "--cov-report=term-missing",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
